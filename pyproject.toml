[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aigc-video-reasonableness-evaluation"
version = "0.1.0"
description = "AIGC 生成式视频合理性多维度评测框架"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "numpy==1.23.5",
    "opencv-python==4.11.0.86",
    "torch==2.5.6",
    "torchvision==0.20.1",
    "Pillow==11.3.0",
    "scipy==1.13.1",
    "pandas==2.3.3",
    "matplotlib==3.10.7",
    "seaborn==0.13.2",
    "tqdm==4.67.1",
    "decord==0.6.0",
    "mediapipe==0.10.21",
    "albumentations==1.3.1",
    "onnxruntime-gpu==1.23.2",
    "hydra-core==1.3.2",
    "insightface==0.7.3",
    "py-feat==0.6.2",
    "timm==1.0.27",
    "openai==2.36.0",
    "anthropic==0.100.0",
    "requests==2.32.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "ruff==0.15.12",
]
# 阿里云百炼 DashScope（视频 VLM 评测脚本 eval_video_reasonableness_dashscope.py）
dashscope = [
    "dashscope>=1.19.0",
]
# 需要手动安装的第三方模型（不在 PyPI 上）
# cotracker     → third_party/ 或 pip install git+...
# groundingdino → third_party/ 或 pip install git+...
# sam2          → third_party/ 或 pip install git+...
# segment_anything → pip install git+https://github.com/facebookresearch/segment-anything.git
# q_align       → third_party/ 或 pip install git+...

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]
