[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aigc-video-reasonableness-evaluation"
version = "0.1.0"
description = "AIGC 生成式视频合理性多维度评测框架"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "torch>=2.0",
    "Pillow>=9.5",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tqdm>=4.65",
    "decord>=0.6",
    "mediapipe>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]
# 阿里云百炼 DashScope（视频 VLM 评测脚本 eval_video_reasonableness_dashscope.py）
dashscope = [
    "dashscope>=1.19.0",
]
# 需要手动安装的第三方模型（不在 PyPI 上）
# cotracker     → third_party/ 或 pip install git+...
# groundingdino → third_party/ 或 pip install git+...
# sam2          → third_party/ 或 pip install git+...
# segment_anything → pip install git+https://github.com/facebookresearch/segment-anything.git
# q_align       → third_party/ 或 pip install git+...

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]
